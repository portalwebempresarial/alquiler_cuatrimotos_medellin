<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquiler Cuatrimotos Medellín - Aventura Extrema</title>
    <style>
        /* Estilos Generales y Tema Oscuro */
        :root {
            --bg-color: #121212;
            --text-color: #f4f4f4;
            --accent-green: #2ecc71;
            --accent-green-hover: #27ae60;
            --dark-gray: #1e1e1e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navegación */
        header {
            background-color: rgba(18, 18, 18, 0.9);
            padding: 1rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--accent-green);
        }

        /* Sección Hero */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1675428604186-a165487f857c?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
            color: #ccc;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            transition: background 0.3s ease;
            display: inline-block;
            cursor: pointer;
            border: none;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }

        /* Sección de Galería */
        .gallery-section {
            padding: 5rem 5%;
            text-align: center;
        }

        .gallery-section h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 10px;
            border: 2px solid #333;
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Sección de Reserva (Formulario) */
        .booking-section {
            background-color: var(--dark-gray);
            padding: 5rem 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .booking-section h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: white;
            text-transform: uppercase;
            text-align: center;
        }

        .booking-form {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 4px solid var(--accent-green);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ddd;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: white;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #0a0a0a;
            color: #777;
            border-top: 1px solid #222;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ACMI <span>Medellín</span></div>
    </header>

    <section class="hero">
        <h1>El Plan Perfecto</h1>
        <p>Vive la adrenalina al máximo. Rutas extremas, naturaleza y la mejor experiencia todoterreno a las afueras de Medellín.</p>
        <a href="#reservar" class="btn-whatsapp">Reserva tu Aventura</a>
    </section>

    <section class="gallery-section">
        <h2>Experiencias Reales</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <!-- Imagen de velocidad -->
                <img src="https://images.unsplash.com/photo-1675428604186-a165487f857c?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Velocidad en caminos de tierra">
            </div>
            <div class="gallery-item">
                <!-- Imagen de agua/cascada -->
                <img src="https://thebalipackage.com/wp-content/uploads/2024/06/Kuber-atv-bali-quad-bike-ride.jpg" alt="Rutas por agua y cascadas">
            </div>
            <div class="gallery-item">
                <!-- Imagen de recorrido en grupo corregida con el archivo local -->
                <img src="watermarked_img_15049467472041003323.jpg" alt="Recorridos en grupo y paisajes">
            </div>
        </div>
    </section>

    <section id="reservar" class="booking-section">
        <h2>Agenda tu Parche</h2>
        <form class="booking-form" id="wa-form" onsubmit="enviarWhatsApp(event)">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label for="fecha">Fecha de Reserva</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group">
                <label for="cantidad">Número de Cuatrimotos</label>
                <input type="number" id="cantidad" min="1" max="20" required placeholder="Ej: 2">
            </div>
            <div class="form-group">
                <label for="tipo_ruta">Tipo de Ruta</label>
                <select id="tipo_ruta">
                    <option value="Principiante (1 hora)">Principiante (1 hora)</option>
                    <option value="Aventura (2 horas)">Aventura Extrema (2 horas)</option>
                    <option value="Tour Completo (Media tarde)">Tour Completo (Media tarde)</option>
                </select>
            </div>
            <button type="submit" class="btn-whatsapp" style="width: 100%;">Reservar por WhatsApp</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Alquiler Cuatrimotos Medellín. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Establecer la fecha mínima en el selector de fecha al día de hoy
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById("fecha").setAttribute('min', hoy);

        function enviarWhatsApp(event) {
            event.preventDefault();

            // Número de WhatsApp del negocio (Reemplazar con el número real, ej: 573001234567)
            const numeroTelefono = "573000000000"; 

            const nombre = document.getElementById("nombre").value;
            const fecha = document.getElementById("fecha").value;
            const cantidad = document.getElementById("cantidad").value;
            const tipoRuta = document.getElementById("tipo_ruta").value;

            const mensaje = `¡Hola! Me gustaría hacer una reserva de cuatrimotos.%0A%0A*Detalles de la reserva:*%0A👤 *Nombre:* ${nombre}%0A📅 *Fecha:* ${fecha}%0A🛵 *Cantidad:* ${cantidad} cuatrimotos%0A🗺️ *Ruta:* ${tipoRuta}%0A%0A¿Me confirman disponibilidad por favor?`;

            const url = `https://wa.me/${numeroTelefono}?text=${mensaje}`;

            window.open(url, '_blank');
        }
    </script>
</body>
</html>
